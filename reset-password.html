<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Reset Password | Dreamscapes</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  display:grid;
  place-items:center;

  background:
    radial-gradient(
      circle at 50% 20%,
      rgba(139,92,255,.2),
      transparent 40%
    ),
    #05050b;

  color:white;

  font-family:Arial,sans-serif;
}

.card{
  width:min(460px,calc(100% - 30px));

  padding:35px;

  border-radius:24px;

  border:1px solid rgba(255,255,255,.1);

  background:rgba(15,15,28,.9);

  box-shadow:0 30px 100px rgba(0,0,0,.6);
}

h1{
  margin-top:0;

  letter-spacing:2px;
}

p{
  color:#999;
  line-height:1.6;
}

input{
  width:100%;

  padding:14px;

  margin:8px 0 15px;

  border-radius:10px;

  border:1px solid rgba(255,255,255,.1);

  background:#10101b;

  color:white;
}

button{
  width:100%;

  padding:14px;

  border:0;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      #00eaff,
      #8b5cff
    );

  font-weight:bold;

  cursor:pointer;
}

#message{
  margin-top:15px;
  color:#00eaff;
}

</style>

  <link rel="stylesheet" href="assets/css/dreamscapes-global.css">
</head>

<body>

<div class="card">

  <h1>RESET PASSWORD</h1>

  <p>
    Create a new password for your Dreamscapes
    creator account.
  </p>

  <form id="form">

    <input
      id="password"
      type="password"
      minlength="8"
      placeholder="New password"
      required
    >

    <input
      id="confirm"
      type="password"
      minlength="8"
      placeholder="Confirm password"
      required
    >

    <button type="submit">
      UPDATE PASSWORD
    </button>

  </form>

  <div id="message"></div>

</div>

<script>

const SUPABASE_URL =
  "https://cevylpnoexugwgygvtgu.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth:{
        autoRefreshToken:true,
        persistSession:true,
        detectSessionInUrl:true
      }
    }
  );


const form =
  document.getElementById("form");

const message =
  document.getElementById("message");


form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const password =
      document
        .getElementById("password")
        .value;

    const confirm =
      document
        .getElementById("confirm")
        .value;

    if (password.length < 8){

      message.textContent =
        "Password must be at least 8 characters.";

      return;

    }

    if (password !== confirm){

      message.textContent =
        "Passwords do not match.";

      return;

    }

    const {
      error
    } =
      await supabaseClient.auth
        .updateUser({
          password
        });

    if (error){

      message.textContent =
        error.message;

      return;

    }

    message.textContent =
      "Password updated. Redirecting...";

    setTimeout(
      () => {

        window.location.replace(
          "creator-portal.html"
        );

      },
      1000
    );

  }
);

</script>

  <script src="assets/js/dreamscapes-global.js"></script>
</body>

</html>
